services:
  postgres:
    image: postgres:16-alpine
    container_name: photo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-photogallery}
      POSTGRES_USER: ${POSTGRES_USER:-photouser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-photosecret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-photouser} -d ${POSTGRES_DB:-photogallery}"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - photo_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: photo_backend
    restart: unless-stopped
    environment:
      PORT: "${PORT:-8080}"
      DATABASE_URL: "${DATABASE_URL:-postgres://${POSTGRES_USER:-photouser}:${POSTGRES_PASSWORD:-photosecret}@postgres:5432/${POSTGRES_DB:-photogallery}?sslmode=disable}"
      UPLOAD_DIR: "${UPLOAD_DIR:-/uploads}"
      JWT_SECRET: "${JWT_SECRET}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      MAX_UPLOAD_SIZE: "${MAX_UPLOAD_SIZE:-20971520}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-}"
    volumes:
      - "${PHOTOS_STORAGE_PATH:-./uploads}:/uploads"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - photo_network

  nginx:
    image: nginx:alpine
    container_name: photo_nginx
    restart: unless-stopped
    ports:
      - "${APP_BIND_IP:-0.0.0.0}:${APP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - "${PHOTOS_STORAGE_PATH:-./uploads}:/uploads:ro"
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - photo_network

volumes:
  postgres_data:

networks:
  photo_network:
    driver: bridge
